name: ExpenseTracker
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9R26W5Y8CF
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources: [ExpenseTracker, StashShared]
    dependencies:
      - target: StashIsland
        embed: true
    info:
      path: ExpenseTracker/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sontungle.expensetracker
            CFBundleURLSchemes: [expensetracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sontungle.expensetracker
        PRODUCT_NAME: ExpenseTracker
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Expense Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  StashIsland:
    type: app-extension
    platform: iOS
    sources: [StashIsland, StashShared, ExpenseTracker/Logic/Money.swift, ExpenseTracker/Model/Kind.swift]
    info:
      path: StashIsland/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Stash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sontungle.expensetracker.stash
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExpenseTrackerTests]
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ExpenseTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ExpenseTracker
  ExpenseTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExpenseTrackerUITests]
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ExpenseTracker
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
    test:
      targets: [ExpenseTrackerTests, ExpenseTrackerUITests]
